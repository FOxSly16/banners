<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<a th:href="@{/banner}">Banners</a>
&nbsp;
<a th:href="@{/category}">Categories</a>
<br/>
<br/>


<b>Banners</b>
<br/>


<form th:method="GET" th:action="@{/banner}">
    <label for="query">Enter banner name</label>
    <input type="text" name="query" id="query">
    <input type="submit" value="Search">
</form>
<br/>
<hr/>

<p th:text="${bannerName}" ></p>


<form th:method="PATCH" th:action="@{/banner/{id}(id=${banner.getId()})}" th:object="${banner}">
    <label for="name">Name</label>
    <input type="text" th:field="*{name}" id="name">
    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    <br/>
    <label for="price">Price</label>
    <input type="text" th:field="*{price}" id="price">
    <div style="color:red" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">ReqName error</div>
    <br/>
    <label for="category">Category</label>
    <select th:field="*{category.id}"  id="category">
        <option th:each="category : ${categories}" th:value="${category.getId()}" th:text="${category.getName()}">
        </option>
    </select>
    <br/>
    <label for="content">Text</label>
    <input type="text" th:field="*{content}" id="content">
    <div style="color:red" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Text error</div>
    <br/>
    <input type="submit" value="Update">
</form>


<form th:method="DELETE" th:action="@{/banner/{id}(id=${banner.getId()})}">
    <input type="submit" value="Delete">
</form>

<hr/>

<div th:each="banner: ${banners}">
    <a th:href="@{/banner/{id}(id=${banner.getId()})}" th:text="${banner.getName()}" >banner</a>
</div>

<form th:method="GET" th:action="@{/banner/new}">
    <input type="submit" value="Create new banner">
</form>


</body>
</html>
