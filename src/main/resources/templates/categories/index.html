<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<a th:href="@{/banner}">Banners</a>
&nbsp;
<a th:href="@{/category}">Categories</a>
<br/>
<br/>

<b>Categories</b>
<br/>

<form th:method="GET" th:action="@{/category}">
    <label for="query">Enter category name</label>
    <input type="text" name="query" id="query">
    <input type="submit" value="Искать">
</form>

<div th:each="category: ${categories}">
    <a th:href="@{/category/{id}(id=${category.getId()})}" th:text="${category.getName()}" >category</a>
</div>


<div th:unless="${#lists.isEmpty(foundedCategories)}">
    <div th:each="category: ${foundedCategories}">
        <a th:href="@{/category/{id}(id=${category.getId()})}" th:text="${category.getName()}" >category</a>
    </div>
</div>



<div th:if="${searched and #lists.isEmpty(foundedCategories)}">
    <p>Categories are not found</p>
</div>



<form th:method="GET" th:action="@{/category/new}">
    <input type="submit" value="Create new category">
</form>





</body>
</html>
