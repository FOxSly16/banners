<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<a th:href="@{/banner}">Banners</a>
&nbsp;
<a th:href="@{/category}">Categories</a>
<br/>
<br/>


<b>Categories</b>
<br/>


<form th:method="GET" th:action="@{/category}">
    <label for="query">Enter category name</label>
    <input type="text" name="query" id="query">
    <input type="submit" value="Search">
</form>


<div th:each="category: ${categories}">
    <a th:href="@{/category/{id}(id=${category.getId()})}" th:text="${category.getName()}" >category</a>
</div>
<br/>
<br/>


<p> Create new category</p>


<form th:method="POST" th:action="@{/category}" th:object="${category}">
    <label for="categoryName">Name</label>
    <input type="text" th:field="*{name}" id="categoryName">
    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    <br/>
    <label for="reqName">Request ID</label>
    <input type="text" th:field="*{reqName}" id="reqName">
    <div style="color:red" th:if="${#fields.hasErrors('reqName')}" th:errors="*{reqName}">ReqName error</div>
    <input type="submit" value="Save">
</form>

</body>
</html>
